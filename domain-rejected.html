<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Denied — Agentforce Coworker</title>
    <link rel="icon" type="image/png" href="assets/blackbaud-favicon.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at top right, #10253d 0%, #07111d 45%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 480px;
      }
      .container .eyebrow {
        color: #00a1df;
        font-size: 0.73rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .container h1 {
        color: #fff;
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
      }
      .container h2 {
        color: #e74c3c;
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .container p {
        color: rgba(255,255,255,0.7);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.2);
        background: transparent;
        color: rgba(255,255,255,0.8);
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:hover {
        border-color: rgba(255,255,255,0.5);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="eyebrow">Executive Briefing</p>
      <h1>Agentforce Coworker</h1>
      <h2>Access Denied</h2>
      <p>
        Your email domain is not authorized to access this application.
        This briefing is restricted to <strong>blackbaud.com</strong> and
        <strong>salesforce.com</strong> email addresses.
      </p>
      <a class="btn" id="sign-out-btn" href="/sign-in.html">Sign in with a different account</a>
    </div>
    <script
      defer
      crossorigin="anonymous"
      src="https://crisp-rodent-2474.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
      type="text/javascript"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_Y3Jpc3Atcm9kZW50LTI0NzQuY2xlcmsuYWNjb3VudHMuZGV2JA"
      src="https://crisp-rodent-2474.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <script>
      window.addEventListener('load', function () {
        Clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor },
        }).then(function () {
          document.getElementById('sign-out-btn').addEventListener('click', function (e) {
            e.preventDefault();
            Clerk.signOut().then(function () {
              window.location.href = '/sign-in.html';
            });
          });
        });
      });
    </script>
  </body>
</html>
